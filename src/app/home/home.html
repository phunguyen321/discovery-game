<div class="game-stage">
  <!-- LỚP 1: NỀN ĐỒNG CỎ 3D FULL MÀN HÌNH -->
  <img src="/images/bg-meadow.jpg" alt="Đồng cỏ xanh" class="bg-layer" draggable="false" />

  <!-- LỚP 2: NÚT ÂM THANH GÓC TRÊN BÊN PHẢI -->
  <button
    type="button"
    class="sound-btn"
    [class.is-muted]="isMuted()"
    (click)="toggleAudio($event)"
    aria-label="Bật tắt âm thanh"
  >
    @if (!isMuted()) {
      <!-- Icon Nốt nhạc chuẩn mockup -->
      <svg viewBox="0 0 24 24" class="music-icon">
        <path
          d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"
          fill="#FFFFFF"
          stroke="#B45309"
          stroke-width="1.5"
        />
      </svg>
    } @else {
      <span class="mute-icon">🔇</span>
    }
  </button>

  <!-- LỚP 3: HAI NHÂN VẬT 3D BÁM ĐÁY MÀN HÌNH -->
  <div class="characters-layer">
    <img src="/images/char-teacher.png" alt="Cô giáo" class="char-teacher" draggable="false" />
    <img src="/images/char-bunny.png" alt="Bạn thỏ" class="char-bunny" draggable="false" />
  </div>

  <!-- LỚP 4: TIÊU ĐỀ GAME & NÚT BẮT ĐẦU (TRUNG TÂM) -->
  <div class="ui-center-layer">
    <h1 class="game-logo" aria-label="Bé ơi, cùng khám phá!">
      <div class="logo-row row-1">
        @for (item of titleRow1; track $index) {
          <span class="bubble-letter" [style.color]="item.color" [class.word-gap]="item.spaceAfter">
            {{ item.char }}
          </span>
        }
      </div>
      <div class="logo-row row-2">
        @for (item of titleRow2; track $index) {
          <span class="bubble-letter" [style.color]="item.color" [class.word-gap]="item.spaceAfter">
            {{ item.char }}
          </span>
        }
      </div>
    </h1>

    <button type="button" class="start-btn" [class.clicked]="isStarting()" (click)="onStartClick()">
      <span class="btn-gloss"></span>
      <span class="btn-text">BẮT ĐẦU</span>
    </button>
  </div>
</div>
